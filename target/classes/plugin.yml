name: Win9xShopAndPay
main: com.win9x.shopandpay.Win9xShopAndPay
version: 1.0.3-SNAPSHOT-beta1
api-version: '1.21'
description: 一个拥有图形化购买界面、CDKey系统、自由市场、拍卖行、系统收购与AI助手的商店插件，支持多币种和Vault经济系统
author: Win9x
depend: [Vault]

commands:
  win9xshopandpay:
    description: Win9xShopAndPay主命令
    usage: /win9xshopandpay <shop/cdkey/currency/reload>
    aliases: [wsap]
    permission: win9xshopandpay.use

permissions:
  win9xshopandpay.use:
    description: 使用主命令的权限
    default: true
  win9xshopandpay.shop:
    description: 打开商店的权限
    default: true
  win9xshopandpay.cdkey.redeem:
    description: 兑换CDKey的权限
    default: true
  win9xshopandpay.cdkey.create:
    description: 创建CDKey的权限
    default: op
  win9xshopandpay.cdkey.delete:
    description: 删除CDKey的权限
    default: op
  win9xshopandpay.cdkey.list:
    description: 列出CDKey的权限
    default: op
  win9xshopandpay.currency.balance:
    description: 查看余额的权限
    default: true
  win9xshopandpay.currency.give:
    description: 给予币种的权限
    default: op
  win9xshopandpay.currency.set:
    description: 设置余额的权限
    default: op
  win9xshopandpay.currency.list:
    description: 列出币种的权限
    default: true
  win9xshopandpay.reload:
    description: 重新加载配置的权限
    default: op
  win9xshopandpay.give_shop:
    description: 获取商店指南针的权限
    default: true
  win9xshopandpay.lottery:
    description: 使用抽奖机的权限
    default: true
  win9xshopandpay.market.use:
    description: 使用自由市场/拍卖行的权限
    default: true
  win9xshopandpay.market.sell:
    description: 在自由市场上架物品的权限
    default: true
  win9xshopandpay.buyback:
    description: 使用系统收购的权限
    default: true
  win9xshopandpay.ai:
    description: 使用AI助手聊天的权限
    default: true
  win9xshopandpay.loan:
    description: 使用贷款功能的权限
    default: true
  win9xshopandpay.ticket:
    description: 使用彩票功能的权限
    default: true
  win9xshopandpay.bank:
    description: 使用银行功能的权限
    default: true