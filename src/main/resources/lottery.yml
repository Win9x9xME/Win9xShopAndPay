# ================================================
# Win9xShopAndPay - 抽奖配置文件
# ================================================
# 
# 配置项说明:
# - type: 物品类型
#   * 原版物品：直接使用Material名称，如DIAMOND, EMERALD
#   * 自定义物品：使用命名空间格式，如pluginname:itemkey（需该插件已加载）
# - amount: 物品数量
# - weight: 权重（越高，中奖概率越大）
# - display-name: 显示名称（支持颜色代码，用&符号）
# - rarity: 稀有度（common, uncommon, rare, epic, legendary）
# 
# 自定义物品示例:
# my_custom_prize:
#   type: myplugin:legendary_item
#   amount: 1
#   weight: 1.0
#   display-name: "&d传说物品"
#   rarity: "legendary"
# 
# ================================================

lottery:
  cost:
    currency-id: "coins"
    amount: 100.0
  prizes:
    common_1:
      type: "DIAMOND"
      amount: 1
      weight: 30.0
      display-name: "&f钻石"
      rarity: "common"
    common_2:
      type: "GOLD_INGOT"
      amount: 5
      weight: 25.0
      display-name: "&6金锭 x5"
      rarity: "common"
    uncommon_1:
      type: "EMERALD"
      amount: 3
      weight: 15.0
      display-name: "&a绿宝石 x3"
      rarity: "uncommon"
    uncommon_2:
      type: "NETHERITE_INGOT"
      amount: 1
      weight: 10.0
      display-name: "&7下界合金锭"
      rarity: "uncommon"
    rare_1:
      type: "DIAMOND_SWORD"
      amount: 1
      weight: 8.0
      display-name: "&b钻石剑"
      rarity: "rare"
    rare_2:
      type: "ENCHANTED_GOLDEN_APPLE"
      amount: 2
      weight: 7.0
      display-name: "&6附魔金苹果 x2"
      rarity: "rare"
    epic_1:
      type: "DRAGON_EGG"
      amount: 1
      weight: 3.0
      display-name: "&5龙蛋"
      rarity: "epic"
    legendary_1:
      type: "NETHER_STAR"
      amount: 1
      weight: 2.0
      display-name: "&d下界之星"
      rarity: "legendary"