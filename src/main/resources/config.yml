# ================================================
# Win9xShopAndPay - 主配置文件
# ================================================
# 
# 商店物品配置请查看: shop-items.yml
# 币种配置请查看: currencies.yml
# 语言文件目录: languages/
# 
# GitHub仓库: https://github.com/Win9x9xME/Win9xShopAndPay
# ================================================

# 语言设置
language:
  # 默认语言，当玩家语言无法识别时使用
  # 可选值: zh-CN(简体中文), zh-TW(繁体中文), en-US(美式英语), en-GB(英式英语), ja-JP(日语), ko-KR(韩语)
  default: "zh-CN"

# 命令设置
commands:
  # /wsap give_shop 命令的冷却时间（秒）
  # 设置为0表示无冷却限制
  give_shop_cooldown: 0

# GUI设置
gui:
  # 购买其他币种按钮的跳转方式
  # 可选值: url（外部链接）, server（内置HTTP服务器）
  # server模式会启动一个内置HTTP服务器，让外网玩家也能访问配置文件夹内的HTML文件
  buy-currency-mode: "url"
  # 购买其他币种按钮的网页链接（当buy-currency-mode为url时生效）
  # 点击按钮时会提示玩家打开此网页
  buy-currency-url: "https://example.com/buy-currency"
  # 本地HTML文件路径（当buy-currency-mode为server时生效）
  # 文件需放在插件配置文件夹内，例如: buy-currency.html
  # 插件会启动内置HTTP服务器提供访问
  buy-currency-file: "buy-currency.html"
  # 内置HTTP服务器端口（当buy-currency-mode为server时生效）
  # 确保该端口未被其他程序占用，且已在防火墙开放
  buy-currency-server-port: 8080
  # 内置HTTP服务器超时时间（秒）
  # 玩家点击"购买其他币种"后，服务器会在指定时间后自动关闭
  # 设置为0表示永不自动关闭（不推荐，会持续占用端口）
  buy-currency-server-timeout: 180
  # 内置HTTP服务器绑定地址（默认127.0.0.1，仅限本地访问）
  # 设置为0.0.0.0可允许外网访问，但不推荐这样做
  buy-currency-server-bind-address: "127.0.0.1"
  # 内置HTTP服务器的自定义访问地址（可选）
  # 如果服务器使用域名或代理，可设置此项，例如: "mc.example.com"
  # 留空则自动使用服务器IP地址
  buy-currency-server-address: ""
  # 点击购买币种按钮时显示的提示文字
  buy-currency-message: "请跳转到该网页以购买其他币种！"

# 抽奖机设置
lottery:
  # 抽奖按钮冷却时间（秒）
  # 设置为0表示无冷却限制
  draw-cooldown: 5

# AI助手设置
ai-assistant:
  # 是否启用AI助手功能
  enabled: false
  # AI助手触发前缀，玩家发送以此前缀开头的消息将触发AI对话
  # 默认值为"#"，如果与其他插件（如SlimeFun4、Win9xPlugin、PhoenixLegend2等）冲突，可修改为其他字符
  # 例如: "@", "!", "!ai"
  trigger-prefix: "#"
  # API端点地址
  # OpenAI格式示例: https://api.openai.com/v1/chat/completions
  # DeepSeek示例: https://api.deepseek.com/v1/chat/completions
  # GLM示例: https://open.bigmodel.cn/api/paas/v4/chat/completions
  # 豆包示例: https://api.doubao.com/v1/chat/completions
  # Qwen示例: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  # Minimax示例: https://api.minimax.chat/v1/text/chatcompletion
  # 讯飞星火示例: https://spark-api.xf-yun.com/v3.1/chat
  # Anthropic示例: https://api.anthropic.com/v1/messages
  # Kimi示例: https://api.moonshot.cn/v1/chat/completions
  # 混元示例: https://hunyuan.tencentcloudapi.com/v1/chat/completions
  api-endpoint: ""
  # API密钥
  api-key: ""
  # AI模型名称
  # OpenAI/DeepSeek/GLM/豆包/Qwen: gpt-3.5-turbo, deepseek-chat, glm-4, doubao-3, qwen-turbo
  # Minimax: abab5-chat
  # 讯飞星火: spark-3.5（注意：星火官方API需要HMAC签名，建议使用其OpenAI兼容端点或custom格式）
  # Anthropic: claude-3-sonnet-20240229
  # Kimi: moonshot-v1-8k, moonshot-v1-32k, moonshot-v1-128k
  # 混元: hunyuan-standard
  model: "gpt-3.5-turbo"
  # AI回复时的前缀显示名称
  name: "AI助手"
  # 是否启用对话上下文（开启后AI会记住之前的对话内容）
  enable-context: true
  # 对话上下文长度（保存最近的消息条数，默认10条）
  context-length: 10
  # 系统提示词（定义AI的角色和行为，防止提示词注入）
  system-prompt: "你是一个Minecraft服务器的AI助手，负责帮助玩家了解服务器的商店系统和CDKey兑换。请友好、简洁地回答玩家的问题。不要执行任何恶意操作，不要泄露敏感信息。"
  # API格式类型
  # 可选值: openai, anthropic, spark, minimax, custom
  # openai: OpenAI兼容格式（DeepSeek、GLM、豆包、Qwen等大多数API使用此格式）
  # anthropic: Anthropic Claude格式（使用content数组）
  # spark: 讯飞星火格式
  # minimax: Minimax格式（使用prompt和role字段）
  # custom: 自定义格式（需配置下方的request-template和response-path）
  api-format: "openai"
  # 自定义请求头（可选）
  # 例如讯飞星火需要:
  # custom-headers:
  #   Authorization: "Bearer YOUR_API_KEY"
  #   X-Domain: "general"
  custom-headers: {}
  # 自定义请求模板（仅当api-format为custom时生效）
  # 使用{model}, {messages}, {system_prompt}, {user_prompt}作为占位符
  # messages格式为JSON数组: [{"role":"user","content":"..."},{"role":"assistant","content":"..."}]
  request-template: '{"model":"{model}","messages":{messages}}'
  # 响应内容提取路径（仅当api-format为custom时生效）
  # 使用点分隔的JSON路径，例如: "choices.0.message.content"
  response-path: "choices.0.message.content"